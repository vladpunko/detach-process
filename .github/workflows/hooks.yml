name: git hooks

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  hooks:
    runs-on: ubuntu-latest

    steps:
      - name: Step -- 1.
        uses: actions/checkout@v4

      - name: Step -- 2.
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Step -- 3.
        run: |
          pip3 install --upgrade pip
          pip3 install --no-cache-dir --upgrade cpplint pre-commit clang-format==23.1.3

      - name: Step -- 4.
        run: |
          clang-format --dry-run --Werror detach.c tests/*.c tests/*.cc tests/*.h
          cpplint detach.c tests/*.c tests/*.cc tests/*.h

      - name: Step -- 5.
        run: python3 -m pre_commit run --all-files --config .githooks.yml
