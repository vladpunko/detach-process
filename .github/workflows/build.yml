name: detach build

on:
  push:
    branches:
      - "master"
    tags:
      - "*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Step -- 1.
        uses: actions/checkout@v4

      - name: Step -- 2.
        run: cc -Wall -Wextra -Werror -Wno-unused-parameter detach.c -o detach

      - name: Step -- 3.
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Step -- 4.
        run: cmake --build build --parallel 2

      - name: Step -- 5.
        run: ctest --test-dir build --output-on-failure --parallel 2

      # Instrument only the fault executable after checking the production binary.
      - name: Configure coverage
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DENABLE_COVERAGE=ON

      - name: Check full coverage
        if: runner.os == 'macOS'
        run: cmake --build build --target coverage --parallel 2
