name: detach build

on:
  push:
    branches:
      - "master"
    tags:
      - "*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Step -- 1.
        uses: actions/checkout@v4

      - name: Step -- 2.
        run: make build

      - name: Step -- 3.
        if: runner.os == 'Linux'
        run: make tests

      - name: Step -- 4.
        if: runner.os == 'macOS'
        run: make coverage
