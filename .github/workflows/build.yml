name: detach build

on:
  push:
    branches:
      - "master"
    tags:
      - "*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Step -- 1.
        uses: actions/checkout@v4

      - name: Step -- 2.
        run: cc -Wall -Wextra -Werror -Wno-unused-parameter detach.c -o detach

      - name: Step -- 3.
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Step -- 4.
        run: cmake --build build --parallel 2

      - name: Step -- 5.
        run: ctest --test-dir build --output-on-failure --parallel 2

      # Instrument only the fault executable after checking the production binary.
      - name: Step -- 6.
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DENABLE_COVERAGE=ON
          cmake --build build --target detach_faults --parallel 2

      - name: Step -- 7.
        if: runner.os == 'macOS'
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/coverage-profiles/%m-%p.profraw
          DETACH_TEST_EXECUTABLE: ${{ github.workspace }}/build/tests/detach_faults
        run: |
          cmake -E remove_directory build/coverage-profiles
          mkdir -p build/coverage-profiles
          ctest --test-dir build --output-on-failure --parallel 2

      - name: Step -- 8.
        if: runner.os == 'macOS'
        run: |
          xcrun llvm-profdata merge -sparse build/coverage-profiles/*.profraw -o build/coverage.profdata
          xcrun llvm-cov report build/tests/detach_faults -instr-profile=build/coverage.profdata detach.c
          xcrun llvm-cov export build/tests/detach_faults -instr-profile=build/coverage.profdata -format=lcov detach.c > build/coverage.lcov
          cmake -DREPORT=build/coverage.lcov -P tests/check_coverage.cmake
