name: detach build

on:
  push:
    branches:
      - "master"
    tags:
      - "*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile standalone C99 source
        run: cc -std=c99 -Wall -Wextra -Werror -Wno-unused-parameter detach.c -o detach

      - name: Build release binary
        run: make build

      - name: Run integration and failure tests
        run: make test

      - name: Check full coverage
        if: runner.os == 'macOS'
        run: make coverage
